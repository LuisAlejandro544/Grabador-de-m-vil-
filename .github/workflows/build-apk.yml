name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Usar caché para dependencias y binarios C++ (Gradle, NDK, CXX)'
        required: true
        default: true
        type: boolean
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Debug (OBS Mobile con C++ NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📜 Aceptar licencias de Android SDK e instalar NDK y CMake
        run: |
          echo "=== Aceptando licencias e instalando herramientas de compilación C++ ==="
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" || true

      - name: ⚡ Restaurar Caché de Gradle y NDK CXX
        if: ${{ inputs.use_cache == true }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            app/.cxx
          key: ${{ runner.os }}-obs-mobile-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'app/src/main/cpp/**') }}
          restore-keys: |
            ${{ runner.os }}-obs-mobile-
            ${{ runner.os }}-gradle-

      - name: 🔑 Generar Keystore de Depuración (debug.keystore)
        run: |
          echo "=== Configurando debug.keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore desde base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generando nuevo debug.keystore con keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "debug.keystore verificado y copiado a ~/.android/."

      - name: ⚙️ Configurar Gradle Wrapper
        run: |
          echo "Generando gradle wrapper sincronizado con versión 9.3.1..."
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || gradle wrapper || true
          chmod +x gradlew

      - name: 🔨 Compilar APK Debug (con C++ DSP, OpenGL ES y FFmpeg Engine)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.configuration-cache=false -Dkotlin.compiler.execution.strategy=in-process"
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          if [ "${{ inputs.use_cache }}" = "false" ]; then
            echo "Modo Compilación Limpia activado (Clean build sin caché)..."
            ./gradlew clean --no-daemon
          fi
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: 📦 Listar APK generado
        run: |
          echo "=== APKs generados con éxito ==="
          ls -la app/build/outputs/apk/debug/

      - name: 🚀 Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Mobile-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
