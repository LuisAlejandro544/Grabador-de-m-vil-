name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'commit_message.txt'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Debug (OBS Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Configurar Gradle con Caché Inteligente
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔑 Generar Keystore de Depuración (debug.keystore)
        run: |
          echo "=== Generando / Configurando debug.keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore desde archivo base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generando nuevo debug.keystore con keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "debug.keystore configurado exitosamente."
          ls -lh debug.keystore

      - name: ⚙️ Asegurar Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "Generando gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: 🔨 Compilar APK Debug
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Verificar y listar APK generado
        run: |
          echo "=== APKs generados ==="
          ls -lh app/build/outputs/apk/debug/

      - name: 🚀 Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: OBS-Mobile-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
