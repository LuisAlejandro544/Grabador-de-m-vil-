name: Build Android Debug APK

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: 'Usar caché para dependencias y binarios C++/Rust (Gradle, NDK, Cargo)'
        required: true
        default: true
        type: boolean
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar APK Debug (Vortex Studio NDK C++ & Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: 📥 Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 📜 Aceptar licencias de Android SDK e instalar NDK y CMake
        run: |
          echo "=== Aceptando licencias e instalando herramientas de compilación C++ NDK ==="
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1" || true

      - name: 🦀 Configurar Toolchain de Rust y Targets Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: ⚡ Restaurar Caché de Gradle, NDK C++ y Rust Cargo
        if: ${{ inputs.use_cache == true }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/.cxx
            app/src/main/rust/target
          key: ${{ runner.os }}-vortex-studio-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml', 'app/src/main/cpp/**', 'app/src/main/rust/**') }}
          restore-keys: |
            ${{ runner.os }}-vortex-studio-
            ${{ runner.os }}-gradle-
            ${{ runner.os }}-rust-

      - name: 📦 Instalar cargo-ndk para compilación cruzada
        run: |
          echo "=== Instalando / verificando cargo-ndk ==="
          if ! command -v cargo-ndk &> /dev/null; then
            cargo install cargo-ndk --locked || cargo install cargo-ndk
          else
            echo "cargo-ndk ya se encuentra en caché."
          fi

      - name: 🦀 Compilar Módulo Nativo Rust (Motor de Streaming de Baja Latencia)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          echo "=== Compilando librerías Rust para arquitecturas Android con cargo-ndk ==="
          mkdir -p app/src/main/jniLibs
          cd app/src/main/rust
          if [ "${{ inputs.use_cache }}" = "false" ]; then
            echo "Limpiando target de Rust para compilación limpia..."
            cargo clean
          fi
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../jniLibs build --release
          cd ../../../
          echo "=== Bibliotecas nativas compiladas en jniLibs ==="
          ls -la app/src/main/jniLibs/

      - name: 🔑 Generar Keystore de Depuración (debug.keystore)
        run: |
          echo "=== Configurando debug.keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            echo "Decodificando debug.keystore desde base64..."
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

          if [ ! -s "debug.keystore" ]; then
            echo "Generando nuevo debug.keystore con keytool..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "debug.keystore verificado y copiado a ~/.android/."

      - name: ⚙️ Configurar Gradle Wrapper
        run: |
          echo "Generando gradle wrapper sincronizado con versión 9.3.1..."
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || gradle wrapper || true
          chmod +x gradlew

      - name: 🔨 Compilar APK Debug (con C++ DSP, OpenGL ES, FFmpeg y Rust Network)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.configuration-cache=false -Dkotlin.compiler.execution.strategy=in-process"
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          if [ "${{ inputs.use_cache }}" = "false" ]; then
            echo "Modo Compilación Limpia activado (Clean build sin caché)..."
            ./gradlew clean --no-daemon
          fi
          ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: 📦 Listar APK generado
        run: |
          echo "=== APKs generados con éxito ==="
          ls -la app/build/outputs/apk/debug/

      - name: 🚀 Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Studio-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

